<script>
  const WIDTH = 400;
  const HEIGHT = 240;
  const NUS_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
  const NUS_RX_UUID      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

  const fileInput = document.getElementById("fileInput");
  const canvas = document.getElementById("preview");
  const ctx = canvas.getContext("2d");
  const uploadBtn = document.getElementById("uploadBtn");
  const statusEl = document.getElementById("status");
  const progressBar = document.getElementById("progressBar");

  let rawPayload = null; // Uint8Array(24000)

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  fileInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = () => {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      const scale = Math.min(WIDTH / img.width, HEIGHT / img.height);
      const w = img.width * scale;
      const h = img.height * scale;
      const x = (WIDTH - w) / 2;
      const y = (HEIGHT - h) / 2;
      ctx.drawImage(img, x, y, w, h);

      rawPayload = convertCanvasTo2BppBytes();
      uploadBtn.disabled = false;
      statusEl.textContent = `Ready! Raw binary size: ${rawPayload.byteLength} bytes.`;
    };
    img.src = URL.createObjectURL(file);
  });

  function convertCanvasTo2BppBytes() {
    const imgData = ctx.getImageData(0, 0, WIDTH, HEIGHT);
    const data = imgData.data;
    const gray = new Float32Array(WIDTH * HEIGHT);

    for (let i = 0; i < WIDTH * HEIGHT; i++) {
      gray[i] = 0.299 * data[i * 4] + 0.587 * data[i * 4 + 1] + 0.114 * data[i * 4 + 2];
    }

    const levels = new Uint8Array(WIDTH * HEIGHT);
    for (let y = 0; y < HEIGHT; y++) {
      for (let x = 0; x < WIDTH; x++) {
        const idx = y * WIDTH + x;
        const oldVal = Math.max(0, Math.min(255, gray[idx]));
        const level = Math.round((oldVal / 255) * 3);
        const newVal = level * 85;
        levels[idx] = level;

        data[idx * 4] = data[idx * 4 + 1] = data[idx * 4 + 2] = newVal;
        data[idx * 4 + 3] = 255;

        const err = oldVal - newVal;
        if (x + 1 < WIDTH) gray[idx + 1] += (err * 7) / 16;
        if (y + 1 < HEIGHT) {
          if (x > 0) gray[idx + WIDTH - 1] += (err * 3) / 16;
          gray[idx + WIDTH] += (err * 5) / 16;
          if (x + 1 < WIDTH) gray[idx + WIDTH + 1] += (err * 1) / 16;
        }
      }
    }
    ctx.putImageData(imgData, 0, 0);

    // Pack 4 pixels per byte (24,000 bytes total)
    const packed = new Uint8Array((WIDTH * HEIGHT) / 4);
    for (let i = 0, bIdx = 0; i < levels.length; i += 4, bIdx++) {
      packed[bIdx] =
        ((levels[i] & 0x03) << 6) |
        ((levels[i + 1] & 0x03) << 4) |
        ((levels[i + 2] & 0x03) << 2) |
        (levels[i + 3] & 0x03);
    }
    return packed;
  }

  uploadBtn.addEventListener("click", async () => {
    if (!navigator.bluetooth || !rawPayload) return;

    try {
      uploadBtn.disabled = true;
      statusEl.textContent = "Requesting Bluetooth device...";

      const device = await navigator.bluetooth.requestDevice({
        filters: [
          { namePrefix: "Espruino" },
          { namePrefix: "MDBT42Q" },
          { services: [NUS_SERVICE_UUID] }
        ],
        optionalServices: [NUS_SERVICE_UUID]
      });

      statusEl.textContent = `Connecting to ${device.name || "Badge"}...`;
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(NUS_SERVICE_UUID);
      const rxChar = await service.getCharacteristic(NUS_RX_UUID);

      // 1. Switch badge into raw binary mode
      statusEl.textContent = "Entering high-speed binary mode...";
      const initCmd = new TextEncoder().encode("\x10startRawUpload();\n");
      await rxChar.writeValue(initCmd);

      // Brief pause so Espruino allocates Uint8Array & detaches REPL
      await new Promise((r) => setTimeout(r, 120));

      // 2. Stream raw binary in 180-byte packets (falls back to 20 if OS rejects high MTU)
      let packetSize = 180;
      progressBar.style.display = "block";
      progressBar.value = 0;
      const startTime = performance.now();

      for (let offset = 0; offset < rawPayload.byteLength; offset += packetSize) {
        const chunk = rawPayload.subarray(offset, offset + packetSize);
        try {
          if (rxChar.writeValueWithoutResponse) {
            await rxChar.writeValueWithoutResponse(chunk);
          } else {
            await rxChar.writeValue(chunk);
          }
        } catch (mtuErr) {
          // If adapter only supports 20-byte MTU, step down automatically
          if (packetSize > 20) {
            packetSize = 20;
            offset -= 180; // retry current offset at 20 bytes
            continue;
          }
          throw mtuErr;
        }

        // 4ms pacing keeps nRF52 RX buffer from overflowing during writeWithoutResponse
        await new Promise((r) => setTimeout(r, 4));

        if (offset % 1800 === 0 || offset + packetSize >= rawPayload.byteLength) {
          const pct = Math.min(100, Math.round(((offset + packetSize) / rawPayload.byteLength) * 100));
          progressBar.value = pct;
          statusEl.textContent = `Streaming binary... ${pct}% (${Math.min(rawPayload.byteLength, offset + packetSize)} / 24000 B)`;
        }
      }

      const elapsed = ((performance.now() - startTime) / 1000).toFixed(1);
      statusEl.textContent = `Done in ${elapsed}s! Refreshing ePaper display...`;

      setTimeout(() => {
        if (device.gatt.connected) device.gatt.disconnect();
      }, 1500);
    } catch (err) {
      statusEl.textContent = "Error: " + err.message;
    } finally {
      uploadBtn.disabled = false;
    }
  });
</script>
